name: Build example site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Scala
        uses: japgolly/setup-everything-scala@3f8419e4a4011d1a97e35335d1226decdd8117b2 # v4.1
        with:
          java-version: "temurin:1.21"
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2.0.2
      - name: Test & run
        run: sbt "test; run --path example --assets-dir pictures"
      - name: Build site
        uses: Tiryoh/actions-mkdocs@08208dbe49e1d15f9a58a6eb691e7dfb2df2253c # v0.25.0
        with:
          mkdocs_version: "latest"
          requirements: "example/requirements.txt"
          configfile: "example/mkdocs.yml"
      - name: Deploy example to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: example/site
