name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload the jar
  packages: write # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Scala
        uses: japgolly/setup-everything-scala@3f8419e4a4011d1a97e35335d1226decdd8117b2 # v4.1
        with:
          java-version: "temurin:1.21"
      - name: Test
        run: sbt coverage test coverageReport
        env:
          GITHUB_TOKEN: ""
      - name: Publish to GitHub Packages
        run: sbt publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # packageBin is wired to assembly, so `sbt publish` has built the fat jar
      - name: Create GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          target/structurizr-mkdocs-generatr.jar
          --verify-tag
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
