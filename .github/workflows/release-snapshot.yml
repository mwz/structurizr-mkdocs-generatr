name: Release Snapshot

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write # publish snapshots to GitHub Packages

jobs:
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Scala
        uses: japgolly/setup-everything-scala@3f8419e4a4011d1a97e35335d1226decdd8117b2 # v4.1
        with:
          java-version: "temurin:1.21"
      - name: Test
        run: sbt coverage test coverageReport
        env:
          GITHUB_TOKEN: ""
      - name: Release snapshot
        run: sbt publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
