name: Scala Steward

on:
  schedule:
    # run 4am every weekday
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    name: Launch Scala Steward
    steps:
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
        with:
          github-repository: mwz/structurizr-mkdocs-generatr
          github-token: ${{ secrets.SCALA_STEWARD }}
          author-name: scala-steward
          author-email: 43047562+scala-steward@users.noreply.github.com
        env:
          GITHUB_TOKEN: ""
