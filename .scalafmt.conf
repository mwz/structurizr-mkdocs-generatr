version = 3.11.3
runner.dialect = scala3
style = defaultWithAlign
maxColumn = 120
docstrings.style = Asterisk
docstrings.wrap = yes
docstrings.wrapMaxColumn = 100
newlines.implicitParamListModifierPrefer = before
align {
  preset = some
  tokens.add = [
    "%",
    "%%",
    "<-",
    {code = "=", owner = "Param"},
    {code = "=>", owner = "Case"}
  ]
}
