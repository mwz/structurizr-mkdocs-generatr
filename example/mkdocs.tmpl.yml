site_name: "Big Bank plc"
repo_url: https://github.com/mwz/structurizr-mkdocs-generatr
edit_uri: edit/main/
plugins:
  - inline-select-svg
  - glightbox
theme:
  name: material
  features:
    - content.tabs.link
extra_css:
  - css/extra.css
markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
