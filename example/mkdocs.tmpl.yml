site_name: "Big Bank plc"
repo_url: https://github.com/mwz/structurizr-mkdocs-generatr
edit_uri: edit/main/
plugins:
  - inline-select-svg
  - glightbox
theme:
  name: material
  features:
    - content.tabs.link
extra_css:
  - css/extra.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/@mwz/techdocs-mkdocs-svg-viewer@0.3.0/dist/svg-viewer.js
markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
